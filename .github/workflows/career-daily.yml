name: CareerOS — veille quotidienne et publication

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *' # 08:17 à Madagascar (UTC+3)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-careeros
  cancel-in-progress: false

jobs:
  veille-et-publication:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer CareerOS
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les scripts sans accès réseau
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/veille_gratuite.py --demo
      - name: Veille gratuite quotidienne (aucune clé requise)
        if: github.event_name != 'push'
        run: python scripts/veille_gratuite.py
      - name: Préparer SDK IA avancée si disponible
        if: github.event_name != 'push' && env.OPENAI_API_KEY != ''
        run: pip install -r requirements.txt
      - name: Enrichissement IA optionnel (recherche Web)
        if: github.event_name != 'push' && env.OPENAI_API_KEY != ''
        continue-on-error: true
        env:
          CAREEROS_MODEL: gpt-4.1-mini
        run: python scripts/veille_ia.py
      - name: Enregistrer nouvelles pistes dans le dépôt
        if: github.event_name != 'push'
        run: |
          git config user.name 'careeros-bot'
          git config user.email 'careeros-bot@users.noreply.github.com'
          git add site/data/veille.js site/data/veille.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser le flux CareerOS'
            git push
          fi
      - name: Vérifier si GitHub Pages est activé
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages n’est pas encore activé : Settings → Pages → Source = GitHub Actions. La veille reste enregistrée dans le dépôt.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configurer Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Charger le site public sans CV ni clés
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publier CareerOS
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
