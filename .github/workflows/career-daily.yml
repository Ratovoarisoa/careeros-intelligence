name: CareerOS — veille IA quotidienne + publication

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 05:17 UTC = 08:17 Madagascar, approximate due to runner delays.
    - cron: '17 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-careeros
  cancel-in-progress: false

jobs:
  veille-et-publication:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le SDK de recherche
        if: github.event_name != 'push' && env.OPENAI_API_KEY != ''
        run: pip install -r requirements.txt
      - name: Rechercher et classer les nouvelles opportunités
        if: github.event_name != 'push' && env.OPENAI_API_KEY != ''
        env:
          CAREEROS_MODEL: gpt-4.1-mini
        run: python scripts/veille_ia.py
      - name: Configuration en attente — site statique uniquement
        if: github.event_name != 'push' && env.OPENAI_API_KEY == ''
        run: echo 'Le site est publié, mais la recherche IA nécessite une clé OPENAI_API_KEY dans les secrets du dépôt.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer les découvertes
        if: github.event_name != 'push' && env.OPENAI_API_KEY != ''
        run: |
          git config user.name 'careeros-bot'
          git config user.email 'careeros-bot@users.noreply.github.com'
          git add site/data/veille.js site/data/veille.json
          if ! git diff --cached --quiet; then
            git commit -m 'Veille quotidienne CareerOS'
            git push
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site public sans CV ni secrets
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
